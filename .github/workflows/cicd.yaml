name: cicd for tomcat sonarqube nexus
on:
  push:
   branches: main
  workflow_dispatch:
jobs:
   build-deploy:
        runs-on: ubuntu-latest
        steps:
           - name: checkoutcode
             uses: actions/checkout@v4
           - name: set-up jdk
             uses: actions/setup-java@v4
             with:
                distribution: temurin
                java-version: '17'
           - name: validate with mavenn
             run: mvn validate
           - name: compile with maven
             run: mvn compile
           - name: test with maven
             run: mvn test
           - name: package with maven
             run: mvn package
           - name: verify war file
             run: ls -lh target/

            #sonarcube scan
           - name: sonarQube scan
             env:
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL }}
             run: |
                 mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
                    -Dsonar.projectKey=train \
                    -Dsonar.projectName=TrainBook \
                    -Dsonar.host.url="$SONAR_HOST_URL" \
                    -Dsonar.token="$SONAR_TOKEN"

          #NEXUS
           - name: configure maven settings.xml
             run: |
              mkdir -p ~/.m2
              cat > ~/.m2/settings.xml <<EOF
              <settings>
               <servers>
                <server>
                 <id>nexus</id>
                 <username>${{ secrets.NEXUS_USERNAME }}</username>
                 <password>${{ secrets.NEXUS_PASSWORD }}</password>
                </server>
               </servers>
              </settings>
              EOF
           - name: deploy artifact to nexus
             run: |
              mvn deploy \
               -DskipTests \
               -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_REPO_URL }}

        #TOMCAT
           - name: deploy war to tomcat
             run: 
              curl -v -u ${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }} \
                   -T target/TrainBook-1.0.0-SNAPSHOT.war \
                   "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"
          
              
                
              
            
